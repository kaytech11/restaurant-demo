databases:
  - name: restaurant-db
    plan: free
services:
  - type: web
    name: restaurant-demo
    runtime: node
    buildCommand: npm install && npm run build
    startCommand: npm start
    envVars:
      - key: DATABASE_URL
        fromDatabase: { name: restaurant-db, property: connectionString }
      - key: ADMIN_PASSWORD
        sync: false
      - key: JWT_SECRET
        generateValue: true
